<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boletim Digital</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- CABEÇALHO -->
  <header class="cabecalho">
    <h1>Boletim Digital</h1>
    <p class="subtitulo">8º Ano — Estudante Exemplo</p>
  </header>

  <!-- CARDS DE RESUMO -->
  <section class="cards-resumo">
    <div class="card" id="card-media">
      <span class="card-titulo">Média geral</span>
      <span class="card-valor" id="valor-media">—</span>
    </div>

    <div class="card" id="card-faltas">
      <span class="card-titulo">Total de faltas</span>
      <span class="card-valor" id="valor-faltas">—</span>
    </div>

    <div class="card" id="card-bom">
      <span class="card-titulo">Bom desempenho</span>
      <span class="card-valor" id="valor-bom">—</span>
    </div>

    <div class="card" id="card-atencao">
      <span class="card-titulo">Precisam de atenção</span>
      <span class="card-valor" id="valor-atencao">—</span>
    </div>

    <div class="card" id="card-frequencia">
      <span class="card-titulo">Frequência</span>
      <span class="card-valor" id="valor-frequencia">—</span>
      <span class="card-extra" id="texto-frequencia"></span>
    </div>
  </section>

  <!-- TABELA DE NOTAS -->
  <section class="area-tabela">
    <table class="tabela-boletim">
      <thead>
        <tr>
          <th>Disciplina</th>
          <th>1º Tri</th>
          <th>2º Tri</th>
          <th>3º Tri</th>
          <th>Média</th>
          <th>Faltas</th>
          <th>Situação</th>
        </tr>
      </thead>
      <tbody id="corpo-tabela">
        <!-- As linhas serão criadas pelo JavaScript -->
      </tbody>
    </table>
  </section>

  <script src="script.js"></script>
</body>
</html>
